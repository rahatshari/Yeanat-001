<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <!-- Crescent & Islamic / Community emblem with treasury book and coins -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="12 12" opacity="0.4" />
  <!-- Treasury Vault / Ledger Book -->
  <g transform="translate(106, 120)">
    <!-- Book back -->
    <rect x="30" y="30" width="240" height="230" rx="20" fill="#022c22" opacity="0.4"/>
    <!-- Book Front -->
    <rect x="20" y="20" width="260" height="230" rx="22" fill="#ffffff"/>
    <rect x="35" y="35" width="230" height="200" rx="14" fill="#f0fdf4"/>
    <!-- Ledger Spine & Lines -->
    <path d="M 35 25 L 35 235" stroke="#059669" stroke-width="10" stroke-linecap="round"/>
    <line x1="70" y1="75" x2="230" y2="75" stroke="#059669" stroke-width="8" stroke-linecap="round"/>
    <line x1="70" y1="115" x2="200" y2="115" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="70" y1="155" x2="230" y2="155" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="70" y1="195" x2="170" y2="195" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Floating Gold Coins with Taka (৳) Symbol -->
  <g transform="translate(290, 260)">
    <circle cx="60" cy="60" r="58" fill="#ca8a04"/>
    <circle cx="56" cy="56" r="56" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="4"/>
    <circle cx="56" cy="56" r="44" fill="none" stroke="#ca8a04" stroke-width="2" stroke-dasharray="4 4"/>
    <!-- Bengali Taka Symbol ৳ -->
    <text x="56" y="74" font-family="'Hind Siliguri', sans-serif" font-size="52" font-weight="bold" fill="#713f12" text-anchor="middle">৳</text>
  </g>
</svg>
